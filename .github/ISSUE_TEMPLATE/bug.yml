name: Bug report
description: Report a problem with the camera or controls.
title: "fix: "
body:
  - type: input
    id: versions
    attributes:
      label: Versions
      description: Minecraft, loader and AFK Cinematics versions.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: What happened?
      description: Include the steps to reproduce, expected behaviour and other camera or rendering mods.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Logs or screenshots
      description: Remove private names, server addresses and other sensitive information before sharing.
